[workspace]
resolver = "2"
members = ["crates/coven-threads-core"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Valentina Alexander <val@opencoven.dev>"]
repository = "https://github.com/OpenCoven/coven-threads"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["serde", "serde-well-known", "macros"] }
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
# Ed25519 for the automation-authority vectors only; the core takes a verifier.
ring = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The automation-authority differential runs a debug build of its batch
# example over tens of thousands of signed bundles. Unoptimized, ring's C
# Ed25519 and sha2's portable SHA-256 dominate it threefold; optimizing just
# these two leaves the code under test unoptimized.
[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
